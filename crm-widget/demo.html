<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LingoLink CRM Widget Demo</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      display: flex;
      gap: 20px;
    }
    .crm-panel {
      flex: 2;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .crm-panel h2 {
      margin-top: 0;
      color: #333;
    }
    .widget-panel {
      flex: 1;
      min-width: 350px;
    }
    .widget-frame {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .ticket {
      padding: 15px;
      background: #f0f4ff;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .ticket:hover {
      background: #e0e7ff;
    }
  </style>
</head>
<body>
  <div class="crm-panel">
    <h2>📋 Zendesk Ticket Simulator</h2>
    <p style="color: #666;">Click a ticket to translate it:</p>
    
    <div class="ticket" onclick="translateTicket('Good morning, I need help with my account')">
      <strong>Ticket #1001</strong><br>
      "Good morning, I need help with my account"
    </div>
    
    <div class="ticket" onclick="translateTicket('My payment did not go through')">
      <strong>Ticket #1002</strong><br>
      "My payment did not go through"
    </div>
    
    <div class="ticket" onclick="translateTicket('How do I reset my password?')">
      <strong>Ticket #1003</strong><br>
      "How do I reset my password?"
    </div>
  </div>

  <div class="widget-panel">
    <iframe id="lingolinkWidget" class="widget-frame" src="widget.html"></iframe>
  </div>

  <script>
    function translateTicket(text) {
      const iframe = document.getElementById('lingolinkWidget');
      iframe.contentWindow.postMessage({
        type: 'lingolink_translate',
        text: text
      }, '*');
    }
  </script>
</body>
</html>
